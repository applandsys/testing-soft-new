# Production stack for testing-soft. Usage: see DEPLOY.md.
#   docker compose up -d --build

name: testing-soft

services:
  app:
    build:
      context: .
      target: app
    image: testing-soft-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: .
      target: web
    image: testing-soft-web:latest
    restart: unless-stopped
    ports:
      # Default 80 serves the site directly. Set HTTP_BIND=127.0.0.1:8080 in .env
      # when a host-level Nginx/Certbot handles HTTPS in front (DEPLOY.md, step 6).
      - "${HTTP_BIND:-80}:80"
    volumes:
      - storage:/var/www/html/storage:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - internal

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    # No published port: MySQL is reachable only from the app container.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

volumes:
  storage:
  db-data:

networks:
  internal:
