# testing-soft uses the project root as its web root (cPanel layout), so URLs
# such as /theme/..., /images/... and /sound/... point at root-level folders.
# Only those static folders are served directly; every other request goes to
# index.php, so files like .env or composer.json can never be downloaded.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    server_tokens off;
    # Nginx's own redirects stay relative, so the host port (e.g. :5000) is kept.
    absolute_redirect off;
    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite build output (fingerprinted file names, safe to cache long-term).
    location ^~ /build/ {
        root /var/www/html/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Files from `php artisan storage:link` (storage/app/public).
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
    }

    location ~ ^/(theme|images|sound)/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /report.png {
        root /var/www/html/public;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Everything else is handled by Laravel's front controller.
    location / {
        fastcgi_pass app:9000;
        fastcgi_read_timeout 60s;

        fastcgi_param SCRIPT_FILENAME   /var/www/html/index.php;
        fastcgi_param SCRIPT_NAME       /index.php;
        fastcgi_param DOCUMENT_ROOT     /var/www/html;
        fastcgi_param DOCUMENT_URI      /index.php;
        fastcgi_param REQUEST_URI       $request_uri;
        fastcgi_param QUERY_STRING      $query_string;
        fastcgi_param REQUEST_METHOD    $request_method;
        fastcgi_param CONTENT_TYPE      $content_type;
        fastcgi_param CONTENT_LENGTH    $content_length;
        fastcgi_param SERVER_PROTOCOL   $server_protocol;
        fastcgi_param REQUEST_SCHEME    $scheme;
        fastcgi_param HTTPS             $https if_not_empty;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE   nginx;
        fastcgi_param REMOTE_ADDR       $remote_addr;
        fastcgi_param REMOTE_PORT       $remote_port;
        fastcgi_param SERVER_ADDR       $server_addr;
        fastcgi_param SERVER_PORT       $server_port;
        fastcgi_param SERVER_NAME       $host;
    }
}
